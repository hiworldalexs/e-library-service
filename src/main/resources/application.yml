server:
  port: 8080

spring:
  application:
    name: e-library-service
  datasource:
    url: jdbc:h2:mem:e-library-service;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

e-library-service:
  max-concurrent-borrows: 10
  loan-period-days: 14

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
