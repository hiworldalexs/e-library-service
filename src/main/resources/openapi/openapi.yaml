openapi: 3.0.3
info:
  title: e-library-service
  version: 1.0.0
  description: Backend take-home — browse, borrow, and return books.
servers:
  - url: http://localhost:8080
tags:
  - name: Books
  - name: Loans
paths:
  /books:
    get:
      tags: [Books]
      operationId: browseBooks
      summary: Browse books with offset pagination and optional filters
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: title
          in: query
          required: false
          description: Case-insensitive contains filter on title
          schema:
            type: string
          example: Clean
        - name: author
          in: query
          required: false
          description: Case-insensitive contains filter on author
          schema:
            type: string
          example: Martin
        - name: category
          in: query
          required: false
          description: Case-insensitive exact match on category
          schema:
            type: string
          example: Tech
        - name: sort
          in: query
          required: false
          description: Sort field and direction as field,direction
          schema:
            type: string
            enum:
              - title,asc
              - title,desc
              - author,asc
              - author,desc
              - category,asc
              - category,desc
            default: title,asc
          example: title,asc
      responses:
        '200':
          description: Paged list of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBooksResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: INVALID_REQUEST
                message: Invalid sort

  /books/{bookId}:
    get:
      tags: [Books]
      operationId: getBook
      summary: Retrieve book details including available copies
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: BOOK_NOT_FOUND
                message: Not specified

  /books/{bookId}/borrow:
    post:
      tags: [Books]
      operationId: borrowBook
      summary: Borrow a book for the calling user
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Borrow succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowResponse'
        '401':
          description: Missing or blank X-User-Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: UNAUTHENTICATED
                message: Not specified
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: BOOK_NOT_FOUND
                message: Not specified
        '409':
          description: Not available, already borrowed, borrow limit exceeded, or the user has an overdue loan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookNotAvailable:
                  summary: No copies left
                  value:
                    errorCode: BOOK_NOT_AVAILABLE
                    message: Not specified
                alreadyBorrowed:
                  summary: User already holds this book
                  value:
                    errorCode: BOOK_ALREADY_BORROWED
                    message: Not specified
                borrowLimitExceeded:
                  summary: Concurrent borrow limit reached
                  value:
                    errorCode: BORROW_LIMIT_EXCEEDED
                    message: Not specified
                userHasOverdueLoan:
                  summary: User has an overdue loan
                  value:
                    errorCode: USER_HAS_OVERDUE_LOAN
                    message: Not specified

  /books/{bookId}/return:
    post:
      tags: [Books]
      operationId: returnBook
      summary: Return a book currently held by the calling user
      parameters:
        - $ref: '#/components/parameters/BookId'
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Return succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'
        '401':
          description: Missing or blank X-User-Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: UNAUTHENTICATED
                message: Not specified
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: BOOK_NOT_FOUND
                message: Not specified
        '409':
          description: User does not hold an active loan for this book, or the loan was updated concurrently (OPTIMISTIC_LOCK_ERROR). Retry the return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bookNotBorrowedByUser:
                  summary: User does not hold this book
                  value:
                    errorCode: BOOK_NOT_BORROWED_BY_USER
                    message: Not specified
                optimisticLock:
                  summary: Concurrent update; retry the return
                  value:
                    errorCode: OPTIMISTIC_LOCK_ERROR
                    message: The loan was updated by another request. Please retry.

  /loans:
    get:
      tags: [Loans]
      operationId: listLoans
      summary: List the calling user's active loans (no pagination)
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Active loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanResponse'
              example:
                - bookId: 11111111-1111-1111-1111-111111111101
                  title: Clean Code
                  borrowedAt: 2026-01-04T10:00:00Z
                  dueDate: 2026-01-18T10:00:00Z
        '401':
          description: Missing or blank X-User-Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: UNAUTHENTICATED
                message: Not specified

components:
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: 11111111-1111-1111-1111-111111111101
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: Caller identity (not persisted). Must be non-blank.
      schema:
        type: string
        minLength: 1
        example: user-42

  schemas:
    BookResponse:
      type: object
      required: [id, title, author, category, totalCopies, availableCopies]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        category:
          type: string
        totalCopies:
          type: integer
          minimum: 0
        availableCopies:
          type: integer
          minimum: 0
      example:
        id: 11111111-1111-1111-1111-111111111101
        title: Clean Code
        author: Robert C. Martin
        category: Tech
        totalCopies: 2
        availableCopies: 1

    PagedBooksResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
      example:
        content:
          - id: 11111111-1111-1111-1111-111111111101
            title: Clean Code
            author: Robert C. Martin
            category: Tech
            totalCopies: 2
            availableCopies: 1
        page: 0
        size: 20
        totalElements: 1
        totalPages: 1

    BorrowResponse:
      type: object
      required: [bookId, title, borrowedAt, dueDate]
      properties:
        bookId:
          type: string
          format: uuid
        title:
          type: string
        borrowedAt:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
      example:
        bookId: 11111111-1111-1111-1111-111111111101
        title: Clean Code
        borrowedAt: 2026-01-04T10:00:00Z
        dueDate: 2026-01-18T10:00:00Z

    ReturnResponse:
      type: object
      required: [bookId, title, returnedAt]
      properties:
        bookId:
          type: string
          format: uuid
        title:
          type: string
        returnedAt:
          type: string
          format: date-time
      example:
        bookId: 11111111-1111-1111-1111-111111111101
        title: Clean Code
        returnedAt: 2026-01-10T15:30:00Z

    LoanResponse:
      type: object
      required: [bookId, title, borrowedAt, dueDate]
      properties:
        bookId:
          type: string
          format: uuid
        title:
          type: string
        borrowedAt:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
      example:
        bookId: 11111111-1111-1111-1111-111111111101
        title: Clean Code
        borrowedAt: 2026-01-04T10:00:00Z
        dueDate: 2026-01-18T10:00:00Z

    ErrorResponse:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
          description: Application error code (HTTP status is conveyed separately)
        message:
          type: string
          description: Human-readable error detail
          default: Not specified
      example:
        errorCode: BOOK_NOT_FOUND
        message: Not specified
